name: Sync Extensions

on:
  schedule:
    # Run once every 24 hours to check for new releases across extension repos
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows 1-click manual trigger from the Actions tab anytime
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Test Suite
        run: npm test

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add registry.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync plugins registry [skip ci]" && git push)
